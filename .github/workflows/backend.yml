name: backend
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: procezo
          POSTGRES_USER: procezo
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U procezo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PROCEZO_DB_ENGINE: ${{ matrix.engine }}
      PROCEZO_PG_NAME: procezo
      PROCEZO_PG_USER: procezo
      PROCEZO_PG_PASSWORD: test-only-password
      PROCEZO_PG_HOST: localhost
      PROCEZO_PG_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
      - run: python manage.py spectacular --file openapi/v1.yaml --validate
      - run: git diff --exit-code -- openapi/v1.yaml
