components:
  schemas:
    Act:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        request_version:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        mode:
          $ref: '#/components/schemas/ModeEnum'
        imported_document:
          type: string
          format: uuid
          nullable: true
        sha256:
          type: string
          maxLength: 64
        prepared_by:
          type: integer
        prepared_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - mode
      - prepared_at
      - prepared_by
      - request_version
      - sha256
    Assessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        receipt:
          $ref: '#/components/schemas/ReceiptEnum'
        completeness:
          $ref: '#/components/schemas/CompletenessEnum'
        substance:
          $ref: '#/components/schemas/SubstanceEnum'
        reason:
          type: string
          maxLength: 500
        actor:
          type: integer
        recorded_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - completeness
      - id
      - reason
      - receipt
      - recorded_at
      - substance
      - version
    AssessmentInput:
      type: object
      properties:
        version:
          type: integer
          minimum: 0
        receipt:
          $ref: '#/components/schemas/ReceiptEnum'
        completeness:
          $ref: '#/components/schemas/CompletenessEnum'
        substance:
          $ref: '#/components/schemas/SubstanceEnum'
        reason:
          type: string
          maxLength: 500
      required:
      - completeness
      - reason
      - receipt
